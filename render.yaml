# Render blueprint for Brightpath EdTech CRM
# https://render.com/docs/blueprint-spec

databases:
  - name: postgres
    plan: free
    ipAllowList: []

services:
  # Backend API (Express)
  - type: web
    name: edtech-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 3600000
      - key: PORT
        value: "8081"
      - key: APP_CORS_ALLOWED_ORIGIN
        fromService:
          type: web
          name: edtech-frontend
          property: domain

  # Frontend (React + Vite static site)
  - type: web
    name: edtech-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: edtech-api
          property: url